<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="title">The Library</div>
    <div class="book-container"></div>
    <div class="book-creator">
        <div class="form">
            <div class="legend">Create new book and put it into the library</div>
            <div class="input">
                <div class="input-place">
                    <label for="">Book Name</label>
                    <input type="text">
                </div>
                <div class="input-place">
                    <label for="">Author</label>
                    <input type="text">
                </div>
                <div class="input-place">
                    <label for="">Page Numer</label>
                    <input type="text">
                </div>
                <div class="submit">Submit</div>
            </div>
        </div>
    </div>
</body>
</html>
