<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="index.js" defer></script>
</head>
<body>
    <div class="title">The Library</div>
    <div class="book-creator">
        <form class="form" action="index.html" method="post" id="add-book-form">
            <div class="legend">Create new book and put it into the library</div>
            <div class="input">
                <div class="input-place">
                    <label for="name">Book Name</label>
                    <input type="text" id="name">
                </div>
                <div class="input-place">
                    <label for="author">Author</label>
                    <input type="text" id="author">
                </div>
                <div class="input-place">
                    <label for="page-number">Page Numer</label>
                    <input type="text" id="page-number">
                </div>
                <div class="input-place">
                    <label for="have-read">Have read already</label>
                    <select name="have-read" id="have-read">
                        <option value="true">yes</option>
                        <option value="false">no</option>
                    </select>
                </div>
                <div class="submit">
                    <button type="submit" id="submit">Submit</button>
                </div>
            </div>
        </form>
    </div>
    <div class="book-container"></div>
</body>
</html>
